# Comprehensive test suite workflow.
# Runs unit and integration tests across multiple Python versions and operating systems.
# The benchmarks are not run here: ci-benchmark.yaml runs them nightly.
# The ubuntu-latest/3.14 cell of the matrix also uploads coverage to Codecov,
# so coverage tracking rides on an existing run instead of a separate full test pass.

name: Unit & Integration Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  # Test across multiple Python versions and operating systems
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # free-threaded and macOS cells are slow
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        # Test all supported Python versions including free-threaded builds (t suffix)
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # setup-venv-uv-action and the invoke tasks do not support Windows, so the environment is
      # set up with uv and pytest is called directly, with the options of inv test.unit --cov and
      # inv test.integration --cov, in the same way on every system.
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # ratchet:astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run unit tests
        run: >-
          python -m pytest --xdoctest --timeout 10
          --cov=minevent --cov-report=html --cov-report=xml --cov-report=term
          tests/unit
      # Upload the coverage of the unit tests only (the integration tests below
      # replace coverage.xml) from a single representative cell of the matrix (only
      # for the main repository, to avoid spam from forks).
      - name: Upload coverage to Codecov
        if: |
          matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' &&
          github.repository == 'durandtibo/minevent' && (github.event_name == 'push' || github.event_name == 'pull_request')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # ratchet:codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # Ignore codecov failures as the codecov server is not
          # very reliable but we don't want to report a failure
          # in the github UI just because the coverage report failed to
          # be published.
          fail_ci_if_error: false
      - name: Run integration tests
        run: >-
          python -m pytest --xdoctest --timeout 60
          --cov=minevent --cov-report=html --cov-report=xml --cov-report=term
          tests/integration
