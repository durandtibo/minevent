# Dependency compatibility testing workflow.
# Tests the package with different versions of its dependencies.
# Ensures compatibility across supported dependency version ranges.

name: Dependency Compatibility (Source)
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Get the version bounds of the dependencies from
  # dev/config/package_versions.json.
  get-deps:
    uses: ./.github/workflows/lib-get-package-versions.yaml

  # One job per dependency listed below. dev/config/package_versions.json is
  # kept up to date by bot-generate-package-versions.yaml.
  test-dep:
    needs: get-deps
    strategy:
      fail-fast: false
      matrix:
        package-name: [coola] # keys of dev/config/package_versions.json
    uses: ./.github/workflows/ci-test-code-dep.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-deps.outputs.package_versions)[matrix.package-name]) }}
      test-matrix: ${{ inputs.test-matrix }}
