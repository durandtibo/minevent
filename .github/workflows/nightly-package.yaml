name: Nightly Package Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Get the version bounds of the dependencies from
  # dev/config/package_versions.json.
  get-versions:
    uses: ./.github/workflows/lib-get-package-versions.yaml
  # Load the shared python-version/OS matrix from the default config of
  # durandtibo/workflow-config-action
  # once, and pass it down to every job below that needs it.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  stable:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install minevent"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  stable-all:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install "minevent[all]"' # "all" installs everything
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install --pre minevent"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest-all:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install --pre "minevent[all]"' # "all" installs everything
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  test-dep:
    needs: [get-versions, get-matrix]
    strategy:
      fail-fast: false
      matrix:
        package-name: [coola] # keys of dev/config/package_versions.json
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions)[matrix.package-name]) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
