# Nightly tests of the package published on PyPI.
# Runs every day and on demand. Tests the latest stable release, and the latest
# version including the pre-releases, with nightly-test-package.yaml.

name: Nightly Package Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Read the package name from pyproject.toml.
  get-metadata:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-package-metadata.yaml

  # Load the shared python-version/OS matrix from the default config of
  # durandtibo/workflow-config-action
  # once, and pass it down to every job below that needs it.
  get-matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  stable:
    permissions:
      contents: read
    needs: [get-matrix, get-metadata]
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install ${{ needs.get-metadata.outputs.normalized_name }}"
      package-name: ${{ needs.get-metadata.outputs.normalized_name }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest:
    permissions:
      contents: read
    needs: [get-matrix, get-metadata]
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install --pre ${{ needs.get-metadata.outputs.normalized_name }}"
      package-name: ${{ needs.get-metadata.outputs.normalized_name }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
