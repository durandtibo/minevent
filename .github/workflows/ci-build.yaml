# Build and package validation workflow.
# Tests that the package can be built correctly as both source distribution and wheel.
# Validates package metadata and that the package is properly typed.
# On the sdist cells, runs the tests from the unpacked source distribution.

name: Build Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  # Read the package name from pyproject.toml.
  get-metadata:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-package-metadata.yaml

  # Build the sdist and the wheel on every supported Python version (including the free-threaded
  # builds) and run the package checks against the installed package, and the tests from the sdist.
  build:
    permissions:
      contents: read
    needs: get-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        dist-type: ["sdist", "wheel"]
        # Test at least one full build per supported Python version to
        # catch version-specific build regressions (e.g. free-threaded 3.13t/3.14t).
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # ratchet:astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Verify Build
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: ${{ needs.get-metadata.outputs.name }}
          dist-type: ${{ matrix.dist-type }}
      - name: Run package checks
        run: |2

          set -euo pipefail
          echo "🔍 Running package checks..."
          python tests/package_checks.py

          echo "✅ Package checks passed"
      # The sdist ships the tests: they must run from the unpacked archive, which has no file of
      # the repository outside of it. --python is explicit because UV_PYTHON, set by setup-uv,
      # takes precedence over VIRTUAL_ENV.
      - name: Test the source distribution
        if: matrix.dist-type == 'sdist'
        run: |
          set -euo pipefail
          uv build --sdist --out-dir "$RUNNER_TEMP/dist"
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
          cd "$RUNNER_TEMP/sdist"
          uv venv "$RUNNER_TEMP/sdist-venv"
          uv pip install --python "$RUNNER_TEMP/sdist-venv" . anyio pytest pytest-timeout ty
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pytest tests/unit tests/integration
