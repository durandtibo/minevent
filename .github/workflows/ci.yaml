# Main CI workflow that orchestrates all quality checks and tests.
# Runs on pull requests, pushes to main, a nightly schedule, and manual dispatch.
# Builds the package, validates code quality, and runs the tests.
# Coverage is uploaded from the test job of ci-test.yaml rather than a
# separate full test run.
#
# Deliberately NOT called from here, each standalone with its own trigger:
#   - ci-benchmark.yaml: runs nightly on its own schedule instead of gating
#     every PR/push, since a benchmark regression isn't a merge blocker.
#   - ci-verify-workflows.yaml: lints .github/workflows/* itself, so it has its
#     own trigger instead of being part of this workflow.
# See .github/GUIDELINES.md for the naming/prefix and runs-on/timeout
# conventions shared across every workflow in this directory.
#
# The individual check jobs below call out to per-check reusable workflows
# (ci-build.yaml, ci-format.yaml, ...) instead of inlining their steps here,
# so each check can still be run/tested on its own (workflow_dispatch) and to
# keep this file short.
#
# The ruleset of main requires one status check: "ci", the last job below. It
# fails unless every other job succeeded, so list each new job in its "needs".
# Its id is load-bearing: renaming it blocks every pull request.

name: CI
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually
  workflow_call: # the release workflows run the CI before publishing

permissions: {}

# A new push to a pull request cancels the previous run. The group name does not use
# github.workflow: for workflow_call (release-pypi.yaml) it is the name of the caller, whose own
# concurrency group would then be the same and deadlock. Other events are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Load the shared python-version/OS matrix of .github/workflow-config.json
  # once, and pass it down to every job below that needs it.
  get-matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  # Validate package can be built and installed correctly
  build:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/ci-build.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  # Check for circular import dependencies
  cyclic-imports:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-cyclic-imports.yaml

  # Run doctests on code examples
  doctest:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-doctest.yaml
    secrets: inherit

  # Verify code formatting and linting
  format:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-format.yaml

  # Check type annotations with ty
  type-checking:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-type-checking.yaml

  # Run pre-commit hooks for code quality
  pre-commit:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-pre-commit.yaml

  # Run unit tests across multiple Python versions and OS.
  # secrets: inherit is required so the test job can upload coverage to Codecov.
  test:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/ci-test.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    secrets: inherit

  # The required status check. It runs even if a job above failed or was cancelled, because a
  # skipped required check does not block a merge.
  ci:
    permissions: {}
    needs:
      - get-matrix
      - build
      - cyclic-imports
      - doctest
      - format
      - type-checking
      - pre-commit
      - test
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Check the result of every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
