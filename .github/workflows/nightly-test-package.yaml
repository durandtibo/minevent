# Reusable workflow for testing the installed package.
# Tests package installation from PyPI and validates basic functionality, with the package checks of
# the tag of the installed version.
# Used to test stable releases, pre-releases, and different installation configurations.

name: PyPI Package Install Test
on:
  workflow_call:
    inputs:
      install-cmd:
        default: "uv pip install minevent"
        description: "Command to install the package"
        required: false
        type: string
      package-name:
        description: "Name of the installed package, from lib-get-package-metadata.yaml"
        required: true
        type: string
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      # Install uv package manager
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # ratchet:astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      # Install package from PyPI using custom install command
      - name: Install package
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
        run: |
          $INSTALL_CMD
      # The checks of the branch can use an API that the published version does not have: take the
      # ones of the tag of the installed version.
      - name: Check out the package checks of the installed version
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
        run: |
          version=$(python -c "import os; from importlib.metadata import version; print(version(os.environ['PACKAGE_NAME']))")
          git fetch --depth 1 origin tag "v$version"
          git checkout "v$version" -- tests/package_checks.py
      # Display dependency tree and run basic package checks (imports, version, etc.)
      - name: Verify installed package
        uses: ./.github/actions/verify-installed-package
